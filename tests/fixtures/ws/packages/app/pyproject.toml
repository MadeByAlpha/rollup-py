[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lib",
    "requests[socks]>=2.31",
    "markupsafe>=2",
]

[project.optional-dependencies]
fast = ["orjson"]
compat = ["six"]

[project.scripts]
app = "app:main"

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.rollup]
distribution-name = "app-bundled"
external = ["certifi"]
