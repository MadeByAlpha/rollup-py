[project]
name = "rollup-py"
version = "0.1.0"
description = "Rollup-style dependency bundling for Hatchling, built for uv workspaces"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
keywords = ["hatch", "hatchling", "uv", "vendoring", "bundle", "wheel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Hatch",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "hatchling>=1.27",
    "packaging>=24.2",
]

[project.scripts]
rollup-py = "rollup_py.cli:main"

[project.entry-points.hatch]
rollup = "rollup_py.hooks"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollup_py"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests/fixtures/**/uv.lock", "/tests/fixtures/**/dist"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: builds real projects with uv (needs network access to the package index)"]
